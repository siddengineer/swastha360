server:
  port: ${PORT:8080}

spring:
  application:
    name: swasth360-backend
  datasource:
    url: jdbc:h2:mem:swasth360db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "Swasth360SuperSecretJwtKeyHealthcarePrototypes2026SecureIndiaKey!"
    expiration-ms: 86400000 # 24 hours
  ai-service:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
